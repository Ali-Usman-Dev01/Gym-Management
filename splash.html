<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Warriors Fitness</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      background: #0d0d0d;
      height: 100%;
      font-family: 'Arial Black', sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      color: white;
    }

    .splash-container {
      position: relative;
      width: 450px;
      height: 450px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      animation: fadeIn 1s ease-in;
      margin: 60px;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: scale(0.95);
      }
      to {
        opacity: 1;
        transform: scale(1);
      }
    }

    .logo {
      width: 100%;
      height: 100%;
      z-index: 2;
      position: absolute;
      top: 0;
      left: 0;
      filter: drop-shadow(0 0 20px #ff0000);
    }

    .wave {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 320px;
      height: 320px;
      border: 3px solid #ff2f2f;
      border-radius: 50%;
      transform: translate(-50%, -50%) scale(0.6);
      opacity: 0;
      animation: ripple 3s infinite ease-out;
    }

    .wave:nth-child(1) { animation-delay: 0s; }
    .wave:nth-child(2) { animation-delay: 1s; }
    .wave:nth-child(3) { animation-delay: 2s; }

    @keyframes ripple {
      0% {
        transform: translate(-50%, -50%) scale(0.6);
        opacity: 0.4;
      }
      70% {
        opacity: 0.2;
      }
      100% {
        transform: translate(-50%, -50%) scale(2);
        opacity: 0;
      }
    }

    .slogan {
      position: absolute;
      bottom: -60px;
      font-size: 1.5rem;
      color: #fff;
      text-align: center;
      text-transform: uppercase;
      font-weight: bold;
      letter-spacing: 1.5px;
      animation: fadeInText 2s ease-in-out forwards;
      opacity: 0;
    }

    @keyframes fadeInText {
      0% {
        opacity: 0;
        transform: translateY(10px);
      }
      100% {
        opacity: 1;
        transform: translateY(0);
      }
    }
  </style>
</head>
<body>
  <div class="splash-container">
    <div class="wave"></div>
    <div class="wave"></div>
    <div class="wave"></div>
    <img class="logo" src="./public/assets/logo.png" style="border-radius: 100%;" width="80%" alt="Warriors Fitness Logo" />
    <div class="slogan">Warriors Mentality</div>
  </div>
</body>
</html>
